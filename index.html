<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Inventory Space</title>
<link rel="icon" href="logo/icon.svg" type="image/svg+xml">
<link rel="icon" href="logo/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="logo/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inventory Space">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14232B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E4E9EB; --panel:#F6F8F8; --ink:#14232B; --ink-2:#47585F; --line:#C2CBD0;
  --steel:#24607A; --steel-dark:#1A4A5F; --hivis:#F2C200; --alert:#B83A26; --ok:#2E7D4F;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:40px;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.hdr :focus-visible{outline-color:var(--hivis)}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.05;margin:0;letter-spacing:.005em}

/* header */
.hdr{background:var(--ink);color:#fff;position:sticky;top:0;z-index:5}
.hdr-in{max-width:1100px;margin:0 auto;padding:var(--s3) var(--s4);display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap}
.brand{font:700 28px/1 var(--display);margin-right:auto}
.live{display:flex;align-items:baseline;gap:var(--s3)}
.live .v{font:600 34px/1 var(--display);min-width:5.5ch;text-align:right}
.live .u{font:500 18px var(--display);opacity:.7;margin-left:-6px}
.state{display:flex;align-items:center;gap:var(--s2);font-size:14px;color:#D5DEE2}
.dot{width:10px;height:10px;border-radius:50%;background:#7C8A91;flex:none}
.dot.settled{background:#5BD18B}.dot.moving{background:var(--hivis)}.dot.off{background:#E5795F}
.linkbtn{background:none;border:0;color:#C7D3D8;text-decoration:underline;cursor:pointer;padding:var(--s2)}
button.brand{background:none;border:0;color:#fff;cursor:pointer;padding:0;text-align:left}
.tab{display:flex;align-items:center;gap:6px}
.tab svg{width:20px;height:20px;flex:none}
.tab .bd{font:700 13px/18px var(--body);background:var(--hivis);color:var(--ink);border-radius:9px;padding:0 6px;min-width:18px;text-align:center}
.tab .bd:empty{display:none}
.subtabs{max-width:1100px;margin:0 auto;padding:var(--s2) var(--s4) var(--s3);display:flex;gap:var(--s2);overflow-x:auto;scrollbar-width:none}
.subtabs:empty{display:none}
.subtabs button{background:none;border:1px solid #5C7380;color:#C7D3D8;padding:4px 12px;border-radius:16px;cursor:pointer;white-space:nowrap;font-size:14px}
.subtabs button[aria-current=page]{background:#fff;border-color:#fff;color:var(--ink);font-weight:600}
.subtabs .grp{color:#7F949D;font-size:12px;align-self:center;margin-left:6px;white-space:nowrap}
.linkname{background:none;border:0;padding:0;color:inherit;font:inherit;font-weight:inherit;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:rgba(127,127,127,.45);text-underline-offset:3px}
.linkname:hover{text-decoration-color:currentColor}
.srch{position:relative;margin-bottom:var(--s5)}
.srch input[type=search]{font-size:18px;min-height:52px;padding-left:44px;border-color:var(--ink)}
.srch svg{position:absolute;left:14px;top:15px;width:22px;height:22px;color:var(--ink-2)}
.res{list-style:none;margin:var(--s2) 0 0;padding:0;border:1px solid var(--line);background:var(--panel)}
.res li{display:flex;gap:var(--s3);align-items:center;padding:var(--s2) var(--s3);border-bottom:1px solid var(--line);flex-wrap:wrap}
.res li:last-child{border-bottom:0}
.res .nm{flex:1;min-width:180px}
.res .sub{font-size:14px;color:var(--ink-2)}
.cards4{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:var(--s3)}
.acard{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--steel);padding:var(--s3) var(--s4);display:flex;flex-direction:column;gap:var(--s2)}
.acard.warn{border-left-color:var(--alert)}.acard.hi{border-left-color:var(--hivis)}.acard.ok{border-left-color:var(--ok)}
.acard .n{font:700 40px/1 var(--display)}
.acard p{margin:0;font-size:15px}
.acard .btn{align-self:flex-start;margin-top:auto}
.qa{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s2)}
.qa button{background:#fff;border:2px solid var(--line);padding:var(--s3);text-align:left;cursor:pointer;font-weight:600;display:flex;gap:10px;align-items:center}
.qa button:hover{border-color:var(--ink)}
.qa svg{width:22px;height:22px;flex:none;color:var(--steel)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.steps li{display:flex;gap:10px;align-items:center}
.steps .t{flex:1}
.steps .ck{width:22px;height:22px;border-radius:50%;border:2px solid #9EAAB0;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.steps li.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.done span.t{color:var(--ink-2);text-decoration:line-through}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:var(--s3)}
.facts>div{background:#fff;border:1px solid var(--line);padding:var(--s2) var(--s3)}
.facts .k{font-size:13px;color:var(--ink-2)}
.facts .v{font:600 22px/1.2 var(--display)}
.sel{width:100%;padding:8px;min-height:42px;border:2px solid #9EAAB0;background:#fff}
.vcam{position:relative;background:#000;width:100%;max-width:640px;aspect-ratio:16/9;overflow:hidden;display:flex;align-items:center;justify-content:center}
.vcam video{width:100%;height:100%;object-fit:contain}
.vroi{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:3px dashed var(--hivis);box-shadow:0 0 0 9999px rgba(0,0,0,.35);pointer-events:none}
.split{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(240px,1fr);gap:16px}
.split>*{min-width:0}
@media (max-width:760px){.split{grid-template-columns:minmax(0,1fr)}}
.lg{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px}
.bigcount{font:700 96px/1 var(--display)}
.chip.low{border-color:var(--alert);color:var(--alert)}
.tabs{max-width:1100px;margin:0 auto;padding:0 var(--s4);display:flex;gap:var(--s5);overflow-x:auto}
.tab{background:none;border:0;border-bottom:4px solid transparent;color:#AEBDC4;padding:var(--s3) 0 var(--s2);font:600 20px var(--display);cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{color:#fff;border-bottom-color:var(--hivis)}

main{max-width:1100px;margin:0 auto;padding:var(--s5) var(--s4) var(--s6)}
.banner{background:#F8E3DE;border-left:6px solid var(--alert);padding:var(--s3) var(--s4);margin-bottom:var(--s4);display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap}
.banner.info{background:#FFF4C2;border-color:var(--hivis)}
.banner span{flex:1;min-width:200px}

/* board */
.summary{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s4);flex-wrap:wrap;margin-bottom:var(--s4)}
.summary h1{font-size:clamp(40px,7vw,64px);font-weight:700}
.summary p{margin:var(--s2) 0 0;color:var(--ink-2);max-width:60ch}
.board{background-color:var(--panel);background-image:radial-gradient(circle,#C3CCD0 2.2px,transparent 2.8px);background-size:26px 26px;border:1px solid var(--line);padding:var(--s4);display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:var(--s3)}
.tile{position:relative;min-height:132px;padding:var(--s3) var(--s4);display:flex;flex-direction:column;justify-content:space-between;border:3px solid var(--steel);background:var(--steel);color:#fff}
.tile h3{font-size:26px;font-weight:600;overflow-wrap:break-word;hyphens:auto}
.tile .slot{font-size:13px;opacity:.8}
.tile .meta{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--s2);font-size:14px}
.tile .w{font:500 20px var(--display);white-space:nowrap}
.tile.out{background:repeating-linear-gradient(135deg,rgba(242,194,0,.20) 0 9px,transparent 9px 18px),var(--panel);color:var(--ink);border:3px dashed var(--hivis);border-color:#D4A900}
.tile .badge{font:700 16px var(--display);background:var(--hivis);color:var(--ink);padding:0 var(--s2);align-self:flex-start;margin-bottom:var(--s1)}
.tile .flip{background:none;border:0;color:inherit;opacity:.85;text-decoration:underline;cursor:pointer;font-size:13px;padding:var(--s1)}
.tile.out .flip{opacity:.7}

/* generic */
section.block{margin-top:var(--s6)}
section.block>h2{font-size:30px;margin-bottom:var(--s3)}
.btn{background:var(--ink);color:#fff;border:2px solid var(--ink);padding:var(--s2) var(--s4);cursor:pointer;font-weight:600}
.btn:hover{background:#243845}
.btn.sec{background:transparent;color:var(--ink)}
.btn.sec:hover{background:#D5DDE0}
.btn.danger{background:var(--alert);border-color:var(--alert)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
label{display:block;font-size:14px;font-weight:600;margin-bottom:var(--s1)}
input[type=text],input[type=search],input[type=number],input[type=email],input[type=password]{width:100%;padding:var(--s2) var(--s3);border:2px solid #9EAAB0;background:#fff;min-height:42px}
.hint{font-size:14px;color:var(--ink-2);margin:var(--s1) 0 0}
.row{display:flex;gap:var(--s3);flex-wrap:wrap;align-items:flex-end}
.field{flex:1;min-width:140px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line)}
th,td{text-align:left;padding:var(--s2) var(--s3);border-bottom:1px solid var(--line);vertical-align:top;font-size:15px}
th{font:600 17px var(--display);background:#D9E0E3}
.tablewrap{overflow-x:auto}
.chip{display:inline-block;font-size:13px;padding:1px var(--s2);border:1px solid var(--line);background:#fff;margin:0 var(--s1) var(--s1) 0}
.chip.warn{border-color:var(--alert);color:var(--alert)}
.chip.in{border-color:var(--steel);color:var(--steel)}
.chip.out{background:var(--hivis);border-color:#D4A900}
.filters{display:flex;gap:var(--s2);margin-bottom:var(--s3);flex-wrap:wrap}
.filters button{background:#fff;border:2px solid #9EAAB0;padding:var(--s1) var(--s3);cursor:pointer}
.filters button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.log{list-style:none;margin:0;padding:0;border:1px solid var(--line);background:var(--panel)}
.log li{display:grid;grid-template-columns:110px 1fr;gap:var(--s3);padding:var(--s3) var(--s4);border-bottom:1px solid var(--line)}
.log li:last-child{border-bottom:0}
.log .t{color:var(--ink-2);font-size:14px}
.log .what{font-weight:600}
.log .note{font-size:14px;color:var(--ink-2)}
.log li.check{border-left:6px solid var(--alert);padding-left:calc(var(--s4) - 6px)}
.empty{padding:var(--s5);border:2px dashed #9EAAB0;background:var(--panel)}
.empty h2{margin-bottom:var(--s2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--s5)}
.panel{background:var(--panel);border:1px solid var(--line);padding:var(--s4) var(--s5)}
.panel h2{font-size:26px;margin-bottom:var(--s2)}
.panel p{margin:0 0 var(--s3)}
.big{font:600 56px/1 var(--display)}
.status-line{font-size:14px;margin-top:var(--s2);min-height:1.5em}
.status-line.err{color:var(--alert)}.status-line.ok{color:var(--ok)}

/* dialog */
dialog{border:3px solid var(--ink);padding:0;max-width:560px;width:calc(100% - 24px);background:var(--panel);color:var(--ink);max-height:92vh;max-height:92dvh}
dialog[open]{display:flex;flex-direction:column}
dialog>form{display:flex;flex-direction:column;min-height:0;flex:1}
.dlg-b{overflow-y:auto;flex:1;min-height:0}
.dlg-h,.dlg-f{flex:none}
dialog::backdrop{background:rgba(20,35,43,.6)}
.dlg-h{padding:var(--s4) var(--s5);background:var(--ink);color:#fff}
.dlg-h h2{font-size:28px}
.dlg-b{padding:var(--s5);display:grid;gap:var(--s4)}
.dlg-f{padding:var(--s3) var(--s5) var(--s5);display:flex;gap:var(--s3);justify-content:flex-end;flex-wrap:wrap}
.teach{border:2px dashed #9EAAB0;padding:var(--s4);background:#fff}
.teach ol{margin:var(--s2) 0;padding-left:20px}
.samples{display:flex;gap:var(--s2);flex-wrap:wrap;margin:var(--s3) 0}
.samples .s{font:600 20px var(--display);background:var(--steel);color:#fff;padding:0 var(--s3)}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:var(--s3) var(--s5);border-left:8px solid var(--hivis);font-weight:600;z-index:20;max-width:90vw}
.toast[hidden]{display:none}
.center{max-width:420px;margin:12vh auto;padding:0 var(--s4)}
.center h1{font-size:48px;margin-bottom:var(--s3)}
.center form{display:grid;gap:var(--s3);margin-top:var(--s4)}
code{background:#D9E0E3;padding:0 4px}
@media (max-width:640px){
  .tablewrap{overflow:visible}
  table.cards{border:0;background:none}
  table.cards thead{display:none}
  table.cards,table.cards tbody{display:block}
  table.cards tr{display:block;background:var(--panel);border:1px solid var(--line);margin-bottom:12px;padding:12px 14px}
  table.cards td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:4px 0;font-size:15px;text-align:right}
  table.cards td::before{content:attr(data-label);font-weight:600;color:var(--ink-2);text-align:left;flex:none}
  table.cards td:first-child{display:block;text-align:left;font-size:17px;padding-bottom:6px}
  table.cards td:first-child::before,table.cards td.act::before,table.cards td[data-label=""]::before{display:none}
  table.cards td.act{justify-content:flex-start;flex-wrap:wrap;padding-top:8px}
}
@media (max-width:560px){
  .hdr-in{flex-wrap:wrap;gap:var(--s2) var(--s3)}
  .brand{order:1}
  #authbtn{order:2}
  .state{order:4}
  .live{order:5;margin-left:auto}
  .log li{grid-template-columns:1fr;gap:var(--s1)}
  .live .v{font-size:28px}
  .hdr-in{gap:var(--s2) var(--s3)}
  .brand{font-size:24px}
  .linkbtn{padding:var(--s1)}
  .board{padding:var(--s3)}
  .tile h3{font-size:20px}
  .tile{padding:var(--s3)}
  .tile .meta{flex-wrap:wrap}
  .big{font-size:44px}
}
@media (max-width:700px){
  body{padding-bottom:64px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--ink);border-top:1px solid #33464F;max-width:none;padding:0 0 env(safe-area-inset-bottom);gap:0;justify-content:space-around;overflow:visible}
  .tab{flex:1;flex-direction:column;gap:2px;font:600 12px var(--body);padding:8px 0 6px;border-bottom:0;border-top:3px solid transparent;position:relative}
  .tab[aria-selected=true]{border-top-color:var(--hivis)}
  .tab .bd{position:absolute;top:3px;left:calc(50% + 6px);font-size:11px;line-height:16px;min-width:16px;padding:0 4px}
  .subtabs{padding:var(--s2) var(--s3) var(--s3)}
  .toast{bottom:84px}
  .acard{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:10px 12px}
  .acard .n{font-size:30px;min-width:28px}
  .acard p{flex:1 1 calc(100% - 52px);min-width:0}
  .acard .btn{margin-top:0;margin-left:40px}
}
@media (prefers-reduced-motion:no-preference){ .toast{animation:up .18s ease-out} @keyframes up{from{opacity:0;transform:translate(-50%,8px)}} }
</style>
</head>

};

function updateAuthBtn() { const b = $("#authbtn"); if (b) b.textContent = state.user ? "Sign out" : "Sign in"; b.title = state.user?.name ? "Signed in as " + state.user.name : ""; }

async function sendEmail(to, subject, html) {

    headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY }, body: JSON.stringify({ to, subject, html }) });
  const j = await r.json().catch(() => ({})); if (!j.success) throw new Error(j.error || "Could not send the email.");
}
async function doSignIn(email, pin, msg) {

  setSession(data.token, data.name);

function requireAuth(fn, mode) {
  if (state.user) return fn();

  const up = mode === "signup";
  const draw = () => {
    const code = up && step === 2;
    d.innerHTML = `<form method="dialog" id="login"><div class="dlg-h"><h2>${up ? "Create account" : "Sign in"}</h2></div>
    <div class="dlg-b"><p style="margin:0">${code ? "Enter the 6-digit code we emailed to " + esc(pending.email) + "." : up ? "Register with your company email (@" + COMPANY_DOMAIN + ")." : "Sign in with your company email and 4-digit PIN to make changes."}</p>
    ${code ? `<div><label for="cd">Verification code</label><input id="cd" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required></div>` : `
    ${up ? `<div><label for="nm">Full name</label><input id="nm" type="text" autocomplete="name" maxlength="60" required></div>` : ""}
    <div><label for="em">Company email</label><input id="em" type="email" autocomplete="username" required placeholder="name@${COMPANY_DOMAIN}"></div>
    <div><label for="pw">${up ? "Choose a 4-digit PIN" : "PIN"}</label><input id="pw" type="password" inputmode="numeric" maxlength="4" pattern="\\d{4}" autocomplete="${up ? "new-password" : "current-password"}" required></div>`}
    <div class="status-line err" id="lmsg"></div>

      guard(sb.from("tool_events").select("*").order("id", { ascending: false }).limit(200)),
      guard(sb.from("consumables").select("*").eq("active", true).order("name")),
      guard(sb.from("consumable_events").select("*").order("id", { ascending: false }).limit(100)),
      guard(sb.from("reorder_items").select("*").in("status", ["open", "in_draft"]).order("created_at", { ascending: false }).limit(200)),
      guard(sb.from("space_rooms").select("id,name,points").eq("active", true)),

/* ---------- home: what needs doing, search everything, quick actions ---------- */
const kindName = k => k === "tool" ? "Tool" : "Consumable";
const allEntries = () => [...state.tools.map(it => ({ kind: "tool", it })), ...state.citems.map(it => ({ kind: "consumable", it }))];
const fullName = it => it.name + (it.spec ? " " + it.spec : "");
const whereText = it => locText(it) || it.slot || it.location || "";
const onOrder = (kind, id) => state.reorder.find(r => r.kind === kind && r.item_id === id);
function statusText(kind, it) {
  if (kind === "tool") return it.status === "out" ? `<span class="chip out">Out ${esc(ago(it.taken_at))}</span>` : `<span class="chip in">In</span>`;
  return `<span class="chip ${lowItem(it) ? "low" : ""}">${it.count_on_hand} on hand${lowItem(it) ? " · low" : ""}</span>`;
}
function searchItems(q) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean); if (!words.length) return [];
  return allEntries().filter(({ kind, it }) => { const hay = [it.name, it.spec, it.category, it.slot, it.location, locText(it), kindName(kind)].join(" ").toLowerCase(); return words.every(w => hay.includes(w)); })
    .sort((a, b) => (a.it.name.toLowerCase().startsWith(words[0]) ? 0 : 1) - (b.it.name.toLowerCase().startsWith(words[0]) ? 0 : 1) || a.it.name.localeCompare(b.it.name));
}
function resultRows(list) {

  return `<ul class="res">${list.slice(0, 12).map(({ kind, it }) => `<li><div class="nm"><button class="linkname" data-act="sheet" data-kind="${kind}" data-id="${it.id}"><strong>${esc(fullName(it))}</strong></button>
    <div class="sub">${kindName(kind)} · ${esc(whereText(it) || "no place set")}</div></div>${statusText(kind, it)}
    ${it.unit_id ? `<button class="btn sec" data-act="locate" data-kind="${kind}" data-id="${it.id}">Show</button>` : ""}</li>`).join("")}</ul>${list.length > 12 ? `<p class="hint">${list.length - 12} more. Type more of the name to narrow it down.</p>` : ""}`;
}
function attention() {
  const c = [], look = state.events.filter(needsLook), out = state.tools.filter(t => t.status === "out"), late = out.filter(t => t.taken_at && Date.now() - new Date(t.taken_at) > 24 * 3600e3);
  const low = state.citems.filter(lowItem), sug = suggestions(), open = openReorder(), d = state.device;
  const unplaced = allEntries().filter(x => !x.it.unit_id).length, hasSpace = (state.spaceUnits || []).length > 0;

/* teach-by-weighing */
function renderTeach() {
  const b = $("#teachBox"); if (!b) return; const t = state.teach;
  if (!t) {
    b.innerHTML = `<strong>Let the scale weigh it</strong><p class="hint">Matching pauses while you weigh, so nothing else on the board changes.</p>
      <div class="row" style="margin-top:8px"><button type="button" class="btn" id="quickStart">Weigh it now</button><button type="button" class="btn sec" id="teachStart">Start teaching (3 times)</button></div>
      <p class="hint">Weigh it now: one reading, fills in by itself. Teaching: three readings, a more accurate weight and window.</p>`;
    $("#quickStart").onclick = () => startTeach("quick"); $("#teachStart").onclick = () => startTeach("multi"); return;
  }
  if (t.mode === "quick") {
    b.innerHTML = `<strong>Weighing</strong>
      <ol><li>Take the item out of the toolbox (or put it in).</li><li>Wait for <em>Settled</em>. The weight fills in by itself.</li></ol>
      <div>Scale reads <strong class="num" id="teachLive">-</strong></div>
      <div class="row" style="margin-top:12px"><button type="button" class="btn sec" id="teachStop">Cancel</button></div>`;
    $("#teachStop").onclick = stopTeach; updateLive(); return;
  }
  const n = t.samples.length, mean = n ? t.samples.reduce((a, b) => a + b, 0) / n : 0;
  const sd = n > 1 ? Math.sqrt(t.samples.reduce((a, b) => a + (b - mean) ** 2, 0) / (n - 1)) : 0;
  const spread = n ? Math.max(...t.samples) - Math.min(...t.samples) : 0;
  const tol = n ? Math.max(3, round05(Math.max(3 * sd, spread / 2 + 1.5))) : 3;
  t.result = n ? { w: Math.round(mean * 10) / 10, tol } : null;
  b.innerHTML = `<strong>Teaching</strong>
    <ol><li>Take the tool out of the box and wait for <em>Settled</em>.</li><li>Put it back and wait again.</li><li>Repeat 3 times. Each move adds a reading.</li></ol>
    <div>Scale reads <strong class="num" id="teachLive">-</strong></div>
    <div class="samples" aria-live="polite">${t.samples.map(s => `<span class="s num">${fmtG(s)}</span>`).join("") || `<span class="hint">No readings yet.</span>`}</div>
    ${n ? `<p>Average <strong class="num">${fmtG(t.result.w)} g</strong>, window &plusmn; <strong class="num">${fmtG(tol)} g</strong>${n < 3 ? ` <span class="hint">(${3 - n} more recommended)</span>` : ""}</p>` : ""}
    <div class="row"><button type="button" class="btn" id="teachUse" ${n ? "" : "disabled"}>Use this weight</button><button type="button" class="btn sec" id="teachStop">Stop teaching</button></div>`;
  $("#teachUse").onclick = () => { $("#f_w").value = t.result.w; $("#f_t").value = t.result.tol; stopTeach(); toast("Weight filled in. Save the tool to keep it."); };
  $("#teachStop").onclick = stopTeach; updateLive();
}

  if (!c.stable) { st.className = "status-line"; st.textContent = "Moving. Wait for it to settle."; }
  else if (c.frac > 0.3) { st.className = "status-line err"; st.textContent = "Not sure: it falls between whole pieces. Check the weight per piece and the empty bin weight."; }
  else if (Number(c.it.unit_g) < 0.5) { st.className = "status-line"; st.textContent = "Settled, but these pieces are very light for this load cell. Treat the count as approximate."; }
  else { st.className = "status-line ok"; st.textContent = "Settled."; }
}
function itemDialog(item) {
  const d = $("#dlg"); state.editingId = item?.id || null;
  d.innerHTML = `<form method="dialog" id="itemForm"><div class="dlg-h"><h2>${item ? "Edit item" : "Add item"}</h2></div><div class="dlg-b">
    <div><label for="i_name">Name</label><input id="i_name" type="text" required maxlength="60" placeholder="e.g. Pan head screw" value="${esc(item?.name || "")}"></div>
    <div class="row"><div class="field"><label for="i_cat">Type</label><select id="i_cat" style="width:100%;padding:8px;min-height:42px;border:2px solid #9EAAB0;background:#fff">${CATS.map(c => `<option ${c === (item?.category || "Screw") ? "selected" : ""}>${c}</option>`).join("")}</select></div>
      <div class="field"><label for="i_spec">Size</label><input id="i_spec" type="text" maxlength="40" placeholder="e.g. M4 x 10 mm" value="${esc(item?.spec || "")}"></div></div>
    <div class="row"><div class="field"><label for="i_u">Weight per piece (g)</label><input id="i_u" type="number" step="0.001" min="0.001" required value="${item ? item.unit_g : ""}"></div>
      <div class="field"><label for="i_c">Empty bin (g)</label><input id="i_c" type="number" step="0.1" min="0" required value="${item ? item.container_g : 0}"></div></div>
    <div class="row"><div class="field"><label for="i_m">Reorder at or below</label><input id="i_m" type="number" step="1" min="0" value="${item ? item.min_stock : 0}"></div>
      <div class="field"><label for="i_l">Spot label (optional)</label><input id="i_l" type="text" maxlength="60" placeholder="e.g. Bin 4" value="${esc(item?.location || "")}"></div></div>
    ${placeHtml(item || state.placeDefault || null, "ip")}
    ${item ? "" : `<div><label for="i_n">Starting count (optional)</label><input id="i_n" type="number" step="1" min="0" placeholder="leave empty if unknown"></div>`}
    ${state.placeDefault && !item ? againHtml("i_again") : ""}
    ${purchaseHtml(item, "q")}
    <p class="hint">Not sure of the weight per piece? Save a guess, then use Learn weight per piece on Stock, Count by weight.</p></div>
  <div class="dlg-f">${item ? `<button type="button" class="btn danger" id="i_del" style="margin-right:auto">Hide</button>` : ""}<button type="button" class="btn sec" id="i_cancel">Cancel</button><button type="submit" class="btn">Save item</button></div></form>`;
  if (!d.open) d.showModal(); bindPlace("ip");
  $("#i_cancel").onclick = () => { state.placeDefault = null; d.close(); }; d.oncancel = () => { state.placeDefault = null; };
  $("#i_del")?.addEventListener("click", async () => {
    if (!confirm(`Hide ${item.name}? Its history is kept.`)) return;
    try { await guard(rpcAuth("toolscale_consumable_hide", { p_id: item.id })); await refreshAll(); d.close(); renderTab(); } catch (e) {}
  });
  $("#itemForm").onsubmit = async e => {
    e.preventDefault();
    const n = item ? null : $("#i_n").value;
    try {
      const id = await guard(rpcAuth("toolscale_consumable_save", { p_id: item?.id || null, p_name: $("#i_name").value, p_category: $("#i_cat").value, p_spec: $("#i_spec").value,
        p_unit_g: Number($("#i_u").value), p_container_g: Number($("#i_c").value), p_min_stock: Number($("#i_m").value || 0), p_location: $("#i_l").value, p_count: n === "" || n == null ? null : Number(n) }));
      await guard(rpcAuth("toolscale_set_purchase", { p_kind: "consumable", p_id: id, ...readPurchase("q") }));
      await savePlace("consumable", id, "ip", item);
      const again = !!$("#i_again")?.checked, pd = state.placeDefault; state.placeDefault = null;
      state.countItem = state.countItem || id; await refreshAll(); d.close(); if (state.tab !== "s3d") renderTab(); toast("Saved");
      if (again && pd) setTimeout(() => { state.placeDefault = pd; itemDialog(null); }, 40);
    } catch (err) {}
  };
}

/* ---------- reorder list and monthly MR draft ---------- */
function purchaseHtml(it, k) {
  return `<details ${it?.buy_link || it?.unit_price != null ? "open" : ""} style="border:1px solid var(--line);padding:8px 12px;background:#fff"><summary style="cursor:pointer;font-weight:600">Purchase details (used for the monthly MR form)</summary>
    <div style="display:grid;gap:12px;margin-top:12px">
    <div><label for="${k}_link">Buy link</label><input id="${k}_link" type="text" placeholder="https://" value="${esc(it?.buy_link || "")}"></div>
    <div><label for="${k}_desc">Description for the order</label><input id="${k}_desc" type="text" maxlength="120" placeholder="e.g. size, model, colour" value="${esc(it?.buy_desc || "")}"></div>
    <div class="row"><div class="field"><label for="${k}_price">Unit price (SGD)</label><input id="${k}_price" type="number" step="0.01" min="0" value="${it?.unit_price ?? ""}"></div>
      <div class="field"><label for="${k}_fee">Delivery (SGD)</label><input id="${k}_fee" type="number" step="0.01" min="0" value="${it?.delivery_fee ?? ""}"></div>
      <div class="field"><label for="${k}_qty">Usual order qty</label><input id="${k}_qty" type="number" step="1" min="1" value="${it?.reorder_qty ?? 1}"></div></div></div></details>`;
}
function readPurchase(k) {
  const n = id => { const v = $("#" + id).value; return v === "" ? null : Number(v); };
  return { p_link: $("#" + k + "_link").value, p_desc: $("#" + k + "_desc").value, p_price: n(k + "_price"), p_delivery: n(k + "_fee"), p_qty: n(k + "_qty") || 1 };
}
const openReorder = () => state.reorder.filter(r => r.status === "open");
const suggestions = () => state.citems.filter(lowItem).filter(i => !state.reorder.some(r => r.kind === "consumable" && r.item_id === i.id));
const reorderItem = r => (r.kind === "tool" ? state.tools : state.citems).find(x => x.id === r.item_id) || {};
function updateBadge() {
  const set = (sec, n) => { const b = document.querySelector(`.tab[data-sec="${sec}"] .bd`); if (b) b.textContent = n ? n : ""; };
  set("orders", openReorder().length + suggestions().length);
  set("tools", state.tools.filter(t => t.status === "out").length);
  set("stock", state.citems.filter(lowItem).length);
  set("home", state.events.filter(needsLook).length);
}
function renderReorder() {
  const open = openReorder(), drafted = state.reorder.filter(r => r.status === "in_draft"), sug = suggestions();
  const month = new Date().toLocaleString("en", { month: "long" });
  let total = 0, missing = 0;
  const row = r => { const it = reorderItem(r), price = it.unit_price, ok = !!it.buy_link && price != null && price !== "";
    if (!ok) missing++; if (price != null && price !== "") total += r.qty * Number(price) + Number(it.delivery_fee || 0);
    return `<tr><td><strong>${esc(r.item_name)}</strong>${r.note ? `<div class="hint">${esc(r.note)}</div>` : ""}</td><td>${r.kind === "tool" ? "Tool" : "Consumable"}</td><td>${esc(r.reason)}</td>
      <td><input type="number" min="1" step="1" value="${r.qty}" data-qty="${r.id}" style="width:80px;padding:6px;border:2px solid #9EAAB0" aria-label="Quantity"></td>
      <td class="num">${price != null && price !== "" ? fmtG(price, 2) : "-"}</td><td>${ok ? `<span class="chip in">Ready</span>` : `<span class="chip warn">${!it.buy_link ? "No link" : "No price"}</span>`}</td>
      <td><button class="btn sec" data-act="reorder-dismiss" data-id="${r.id}">Remove</button></td></tr>`; };
  $("#main").innerHTML = `<div class="summary"><div><h1>${open.length} to order</h1>
    <p>Low stock and replacement requests are collected here. At the end of the month, add them to your MR draft ("Internal (${month})") in one go. Estimated total ${fmtG(total, 2)} SGD${missing ? `, ${missing} missing a link or price` : ""}.</p></div>
    <button class="btn" data-act="to-draft" ${open.length ? "" : "disabled"}>Add to ${month} MR draft</button></div>
  ${state.draftMsg ? `<div class="banner info"><span>Added ${state.draftMsg.added} item${state.draftMsg.added === 1 ? "" : "s"} to "<strong>${esc(state.draftMsg.label)}</strong>"${state.draftMsg.already_listed ? ` (${state.draftMsg.already_listed} were already on it)` : ""}. Open MR Tracker, go to Drafts, check the prices and links, and submit it at the end of the month.</span><button class="btn sec" data-act="clear-msg">OK</button></div>` : ""}
  ${sug.length ? `<section class="block" style="margin-top:0"><h2>Low on stock, not on the list yet</h2><div>${sug.map(i => `<span class="chip warn" style="font-size:15px;padding:4px 10px">${esc(i.name)}: ${i.count_on_hand} left <button class="linkbtn" style="color:var(--steel);padding:0 0 0 8px" data-act="reorder-suggest" data-id="${i.id}">Add</button></span>`).join("")}</div></section>` : ""}
  ${open.length ? `<div class="tablewrap" style="margin-top:16px"><table class="cards"><thead><tr><th>Item</th><th>Type</th><th>Why</th><th>Qty</th><th>Price</th><th>Details</th><th></th></tr></thead><tbody>${open.map(row).join("")}</tbody></table></div>`
    : `<div class="empty" style="margin-top:16px"><h2>Nothing to order</h2><p>Items go on this list when a consumable falls to its minimum, or when you press Replace on a tool.</p></div>`}
  ${drafted.length ? `<section class="block"><h2>Already in an MR draft</h2><ul class="log">${drafted.map(r => `<li><div class="t">${esc(when(r.created_at))}</div><div><div class="what">${esc(r.item_name)} x ${r.qty}</div><div class="note">${esc(r.reason)}</div></div></li>`).join("")}</ul></section>` : ""}`;
}
function reportDialog(kind, item) {
  const d = $("#dlg"), tool = kind === "tool";
  const reasons = tool ? ["Worn out", "Broken", "Lost", "Other"] : ["Low stock", "Damaged", "Other"];
  d.innerHTML = `<form method="dialog" id="repForm"><div class="dlg-h"><h2>${tool ? "Replace" : "Reorder"}: ${esc(item.name)}</h2></div><div class="dlg-b">
    <div class="row"><div class="field"><label for="r_why">Why</label><select id="r_why" style="width:100%;padding:8px;min-height:42px;border:2px solid #9EAAB0;background:#fff">${reasons.map(x => `<option>${x}</option>`).join("")}</select></div>
      <div class="field"><label for="r_qty">Quantity</label><input id="r_qty" type="number" min="1" step="1" value="${item.reorder_qty || 1}"></div></div>
    <div><label for="r_note">Note (optional)</label><input id="r_note" type="text" maxlength="120"></div>
    <p class="hint">It is added to the reorder list. Nothing is sent until you add the list to your MR draft.</p></div>
  <div class="dlg-f"><button type="button" class="btn sec" id="r_cancel">Cancel</button><button type="submit" class="btn">Add to reorder list</button></div></form>`;
  if (!d.open) d.showModal(); $("#r_cancel").onclick = () => d.close();
  $("#repForm").onsubmit = async e => {
    e.preventDefault();
    try { await guard(rpcAuth("toolscale_report_replacement", { p_kind: kind, p_id: item.id, p_reason: $("#r_why").value, p_qty: Number($("#r_qty").value || 1), p_note: $("#r_note").value }));
      await refreshAll(); d.close(); renderTab(); toast("Added to the reorder list"); } catch (err) {}
  };
}

/* ---------- vision (webcam) ---------- */
function loadScript(src) { return new Promise((res, rej) => { const el = document.createElement("script"); el.src = src; el.onload = res; el.onerror = () => rej(new Error("Could not load " + src)); document.head.appendChild(el); }); }
const VISION_V = "25";   // bump when vision.js changes so browsers do not keep an old copy
let visionLoading = null;
function ensureVision() {   // one shared load, so opening Vision and switching tabs quickly cannot load the code twice
  if (window.VisionUI) return Promise.resolve();
  visionLoading = visionLoading || (async () => {
    if (!window.tf) { try { await loadScript("https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"); } catch (e) { await loadScript("https://unpkg.com/@tensorflow/tfjs@4.22.0/dist/tf.min.js"); } }
    await loadScript("vision.js?v=" + VISION_V);
  })().catch(e => { visionLoading = null; throw e; });
  return visionLoading;
}
async function visionPage(fn) {
  const tab = state.tab;   // a slow or failed load must not touch a different tab the user has moved to
  $("#main").innerHTML = `<div class="empty"><p>Loading camera tools...</p></div>`;
  try { await ensureVision(); if (state.tab !== tab) return; window.VisionUI[fn](); }
  catch (e) { if (state.tab !== tab) return; $("#main").innerHTML = `<div class="banner"><span>Could not load the camera tools: ${esc(e.message || e)}</span></div>`; }
}
let detectLoading = null;
function ensureDetect() { if (window.DetectUI) return Promise.resolve(); detectLoading = detectLoading || loadScript("detect.js?v=" + VISION_V).catch(e => { detectLoading = null; throw e; }); return detectLoading; }
async function detectPage(fn) {
  const tab = state.tab;
  $("#main").innerHTML = `<div class="empty"><p>Loading...</p></div>`;
  try { await ensureDetect(); if (state.tab !== tab) return; window.DetectUI[fn](); }
  catch (e) { if (state.tab !== tab) return; $("#main").innerHTML = `<div class="banner"><span>Could not load this page: ${esc(e.message || e)}</span></div>`; }
}
const renderIdentify = () => visionPage("identify"), renderTrain = () => visionPage("train"), renderVlog = () => visionPage("vlog");
const renderDetect = () => detectPage("detect"), renderLabel = () => detectPage("label");
let spaceLoading = null;
function ensureSpace() { if (window.SpaceUI) return Promise.resolve(); spaceLoading = spaceLoading || loadScript("space.js?v=" + VISION_V).catch(e => { spaceLoading = null; throw e; }); return spaceLoading; }
async function spacePage(fn) {
  const tab = state.tab; $("#main").innerHTML = `<div class="empty"><p>Loading...</p></div>`;
  try { await ensureSpace(); if (state.tab !== tab) return; window.SpaceUI[fn](); }
  catch (e) { if (state.tab !== tab) return; $("#main").innerHTML = `<div class="banner"><span>Could not load this page: ${esc(e.message || e)}</span></div>`; }
}
const renderSplan = () => spacePage("plan"), renderS3d = () => spacePage("view3d"), renderSitems = () => spacePage("items");
/* where an item lives, from the Space mode: "Workshop - Shelf A - level 2" */
function locText(it) {
  const u = (state.spaceUnits || []).find(x => x.id === it.unit_id); if (!u) return "";
  return unitLabel(u) + (u.parent_id ? "" : " · level " + it.level);
}
function locateItem(kind, id) { state.spaceFocus = { kind, id }; if ($("#dlg").open) $("#dlg").close(); if (state.tab === "s3d") renderTab(); else setTab("s3d"); }

/* ---------- clicks ---------- */
async function onMainClick(ev) {
  const el = ev.target.closest("[data-act]"); if (!el) return; const a = el.dataset.act;
  try {
    if (a.startsWith("go:")) { if ($("#dlg").open) $("#dlg").close(); setTab(a.slice(3)); }
    else if (a === "sheet") itemSheet(el.dataset.kind, el.dataset.id);
    else if (a === "count-item") { state.countItem = el.dataset.id; if ($("#dlg").open) $("#dlg").close(); setTab("count"); }
    else if (a === "stockf") { state.stockF = el.dataset.f; renderStock(); labelTables(); }
    else if (a === "scale-count") requireAuth(() => setScaleMode("count"));
    else if (a === "scale-tools") requireAuth(() => setScaleMode("tools"));
    else if (a === "resolve") requireAuth(async () => { const id = el.dataset.id, tid = $("#rs-" + id)?.value; if (!tid) return; try { await guard(rpcAuth("toolscale_set_status", { p_tool: tid, p_status: el.dataset.to })); resolveEvent(id); await refreshAll(); renderTab(); toast("Fixed: " + (state.tools.find(t => t.id === tid)?.name || "tool") + " marked " + el.dataset.to); } catch (e) {} });
    else if (a === "resolve-skip") { resolveEvent(el.dataset.id); renderTab(); }
    else if (a === "goto-tools") setTab("tools");
    else if (a === "locate") locateItem(el.dataset.kind, el.dataset.id);
    else if (a === "goto-reorder") setTab("reorder");
    else if (a === "clear-msg") { state.draftMsg = null; renderReorder(); }
    else if (a === "report") requireAuth(() => reportDialog(el.dataset.kind, (el.dataset.kind === "tool" ? state.tools : state.citems).find(x => x.id === el.dataset.id)));
    else if (a === "reorder-suggest") requireAuth(async () => { const i = state.citems.find(x => x.id === el.dataset.id); try { await guard(rpcAuth("toolscale_report_replacement", { p_kind: "consumable", p_id: i.id, p_reason: "Low stock", p_qty: i.reorder_qty || 1, p_note: i.count_on_hand + " left (minimum " + i.min_stock + ")" })); await refreshAll(); renderTab(); toast(i.name + " added to the order list"); } catch (e) {} });
    else if (a === "reorder-dismiss") requireAuth(async () => { try { await guard(rpcAuth("toolscale_reorder_update", { p_id: el.dataset.id, p_qty: null, p_dismiss: true })); await refreshAll(); renderReorder(); } catch (e) {} });
    else if (a === "to-draft") requireAuth(async () => { try { state.draftMsg = await guard(rpcAuth("toolscale_reorder_to_draft", {})); await refreshAll(); renderReorder(); } catch (e) {} });
    else if (a === "goto-count") setTab("count");
    else if (a === "citem-add") requireAuth(() => itemDialog(null));
    else if (a === "citem-edit") requireAuth(() => itemDialog(state.citems.find(i => i.id === el.dataset.id)));
    else if (a === "cont-now") { const c = countNow(); if (c?.live != null) { $("#cntCont").value = c.live.toFixed(1); state.cont[c.it.id] = $("#cntCont").value; updateCount(); } }
    else if (a === "csave") requireAuth(async () => {
      const c = countNow(); if (!c || c.live == null) return toast("The scale is offline.");
      if (!c.stable && !confirm("The scale is still moving. Save this count anyway?")) return;
      try { await guard(rpcAuth("toolscale_consumable_count", { p_id: c.it.id, p_count: c.n, p_weight: c.live, p_container: c.cont })); await refreshAll(); toast(`${c.it.name}: ${c.n} saved`); if (state.tab === "count") renderCount(); } catch (e) {} });
    else if (a === "clearn") requireAuth(async () => {
      const c = countNow(), n = Number($("#cntN").value); if (!c || c.live == null) return toast("The scale is offline.");
      if (!(n >= 1) || !(c.net > 0)) return toast("Put the pieces in the bin first and enter how many.");
      const u = Math.round(c.net / n * 1000) / 1000, it = c.it;
      if (!confirm(`Weight per piece will be ${u} g (was ${it.unit_g} g). Use it?`)) return;
      try { await guard(rpcAuth("toolscale_consumable_save", { p_id: it.id, p_name: it.name, p_category: it.category, p_spec: it.spec, p_unit_g: u, p_container_g: c.cont, p_min_stock: it.min_stock, p_location: it.location, p_count: null })); await refreshAll(); renderCount(); toast("Learned " + u + " g per piece"); } catch (e) {} });
    else if (a === "goto-check") { state.filter = "check"; setTab("activity"); }
    else if (a === "dismiss") { state.dismissedUpTo = state.events[0]?.id || 0; localStorage.setItem("ts_dismissed", state.dismissedUpTo); renderTab(); }
    else if (a === "add") requireAuth(() => openDialog(null));
    else if (a === "newfromevent") { const ev2 = state.events.find(x => String(x.id) === el.dataset.id); requireAuth(() => openDialog(null, { weight: Math.round(Math.abs(ev2.delta_g) * 10) / 10, out: ev2.delta_g < 0 })); }
    else if (a === "edit") requireAuth(() => openDialog(state.tools.find(t => t.id === el.dataset.id)));
    else if (a === "filter") { state.filter = el.dataset.f; renderActivity(); }
    else if (a === "flip") { const sh = state.sheet; requireAuth(async () => { try { await guard(rpcAuth("toolscale_set_status", { p_tool: el.dataset.id, p_status: el.dataset.to })); await refreshAll(); if (sh && $("#dlg").open) itemSheet(sh.kind, sh.id); } catch (e) {} }); }
    else if (a === "cmd") requireAuth(async () => { el.disabled = true; await runCommand(el.dataset.cmd).finally(() => el.disabled = false); });
    else if (a === "savemin") requireAuth(async () => { try { await guard(rpcAuth("toolscale_set_min_change", { p_device: devId(), p_g: Number($("#minG").value) })); toast("Saved"); refreshDevice(); } catch (e) {} });
    else if (a === "pause") requireAuth(async () => { try { await setLearn(Number(el.dataset.s)); renderScale(); } catch (e) {} });
  } catch (e) { /* banner shown by guard */ }
}

boot();
</script>
</body>
</html>
